<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<title>JARVIS Mark 6.1</title>

<style>
body{
  margin:0;
  background:#071018;
  color:#dff8ff;
  font-family:Arial,sans-serif;
  text-align:center;
}

.app{
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}

h1{
  letter-spacing:5px;
  margin-bottom:5px;
}

.sub{
  color:#75b8c9;
  margin-bottom:25px;
}

.card{
  background:#0c1b23;
  border:1px solid #245465;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 0 15px rgba(66,215,255,.08);
}

.orb{
  width:110px;
  height:110px;
  margin:10px auto 20px;
  border:2px solid #42d7ff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  box-shadow:0 0 20px rgba(66,215,255,.25);
  transition:.3s;
}

.orb.activo{
  box-shadow:
    0 0 20px rgba(66,215,255,.6),
    0 0 45px rgba(66,215,255,.25);
  transform:scale(1.04);
}

#respuesta{
  min-height:55px;
  font-size:18px;
  line-height:1.4;
}

button{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  background:#123b4a;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.principal{
  background:#14758f;
}

.estado{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.cuadro{
  background:#102832;
  padding:12px;
  border-radius:10px;
}

.etiqueta{
  font-size:11px;
  color:#77aebb;
}

.valor{
  font-weight:bold;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="app">

<h1>JARVIS</h1>
<div class="sub">MARK 6.1 · ASISTENTE PERSONAL</div>

<div class="card">

<div class="orb" id="orb">🤖</div>

<div id="respuesta">
A su servicio, señor.
</div>

<button class="principal" onclick="escuchar()">
🎙️ ACTIVAR JARVIS
</button>

<button onclick="detener()">
⏹️ DETENER JARVIS
</button>

</div>


<div class="card estado">

<div class="cuadro">
<div class="etiqueta">🧠 IA NÚCLEO</div>
<div class="valor">ACTIVA</div>
</div>

<div class="cuadro">
<div class="etiqueta">📶 RED</div>
<div class="valor" id="red">--</div>
</div>

<div class="cuadro">
<div class="etiqueta">🔋 ENERGÍA</div>
<div class="valor" id="bateria">--</div>
</div>

<div class="cuadro">
<div class="etiqueta">🎙️ VOZ</div>
<div class="valor" id="vozEstado">LISTA</div>
</div>

</div>


<div class="card">

<button onclick="comando('hola')">
👋 Hola JARVIS
</button>

<button onclick="comando('qué hora es')">
🕐 ¿Qué hora es?
</button>

<button onclick="comando('qué día es hoy')">
📅 ¿Qué día es hoy?
</button>

<button onclick="comando('quién eres')">
🤖 ¿Quién eres?
</button>

<button onclick="comando('qué puedes hacer')">
🧠 ¿Qué puedes hacer?
</button>

<button onclick="comando('estado del sistema')">
⚙️ Estado del sistema
</button>

<button onclick="comando('abre YouTube')">
▶️ Abrir YouTube
</button>

<button onclick="comando('abre Google')">
🔎 Abrir Google
</button>

</div>

</div>


<script>

/* ==========================================
   JARVIS MARK 6.1
   Núcleo de voz y comandos
   ========================================== */

const respuesta =
  document.getElementById("respuesta");

const vozEstado =
  document.getElementById("vozEstado");

const orb =
  document.getElementById("orb");


const Reconocimiento =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let jarvisActivo = false;
let reconocimientoActual = null;


/* ==========================================
   PERSONALIDAD Y VOZ
   ========================================== */

function hablar(texto){

  respuesta.textContent = texto;

  orb.classList.add("activo");

  setTimeout(function(){
    orb.classList.remove("activo");
  },1200);


  /* Voz nativa Android */

  if(
    window.AndroidVoice &&
    typeof window.AndroidVoice.hablar === "function"
  ){

    window.AndroidVoice.hablar(texto);
    return;
  }


  /* Voz del navegador */

  if(!("speechSynthesis" in window)){

    respuesta.textContent =
      texto + " La voz no está disponible.";

    return;
  }


  speechSynthesis.cancel();

  const voz =
    new SpeechSynthesisUtterance(texto);

  voz.lang = "es-MX";

  /* Voz pausada y seria */

  voz.rate = 0.88;
  voz.pitch = 0.72;
  voz.volume = 1;

  speechSynthesis.speak(voz);
}


/* ==========================================
   DETENER TODO
   ========================================== */

function detener(){

  jarvisActivo = false;

  if(reconocimientoActual){

    try{
      reconocimientoActual.abort();
    }catch(e){}

    reconocimientoActual = null;
  }


  if(
    window.AndroidVoice &&
    typeof window.AndroidVoice.detener === "function"
  ){

    window.AndroidVoice.detener();

  }else if("speechSynthesis" in window){

    speechSynthesis.cancel();
  }


  vozEstado.textContent = "LISTA";

  respuesta.textContent =
    "JARVIS en espera, señor.";

  orb.classList.remove("activo");
}


/* ==========================================
   ACTIVAR JARVIS
   ========================================== */

function escuchar(){

  if(!Reconocimiento){

    hablar(
      "El reconocimiento de voz no está disponible, señor. Abra JARVIS con Chrome."
    );

    return;
  }


  if(jarvisActivo){

    hablar(
      "Ya estoy activo, señor."
    );

    return;
  }


  jarvisActivo = true;

  hablar(
    "Sistemas activados, señor. Estoy atento."
  );


  setTimeout(function(){

    escucharSeñor();

  },1500);
}


/* ==========================================
   ESPERAR PALABRA "SEÑOR"
   ========================================== */

function escucharSeñor(){

  if(!jarvisActivo) return;


  const reconocimiento =
    new Reconocimiento();

  reconocimientoActual =
    reconocimiento;


  reconocimiento.lang = "es-GT";

  reconocimiento.interimResults = false;

  reconocimiento.continuous = false;


  reconocimiento.onstart = function(){

    vozEstado.textContent =
      "ESPERANDO SEÑOR";

    respuesta.textContent =
      "Esperando la palabra Señor...";
  };


  reconocimiento.onresult =
  function(event){

    const texto =
      event.results[0][0]
      .transcript
      .trim()
      .toLowerCase();


    if(texto.includes("señor")){

      hablar(
        "Sí, señor. ¿Qué desea?"
      );


      setTimeout(function(){

        if(jarvisActivo){

          escucharOrden();

        }

      },1500);


    }else{

      setTimeout(function(){

        if(jarvisActivo){

          escucharSeñor();

        }

      },500);
    }
  };


  reconocimiento.onerror =
  function(event){

    reconocimientoActual = null;

    if(!jarvisActivo) return;


    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      hablar(
        "Necesito permiso para utilizar el micrófono, señor."
      );

      jarvisActivo = false;

      return;
    }


    setTimeout(function(){

      if(jarvisActivo){

        escucharSeñor();

      }

    },1000);
  };


  reconocimiento.onend =
  function(){

    if(
      vozEstado.textContent ===
      "ESPERANDO SEÑOR"
    ){

      vozEstado.textContent =
        "LISTA";
    }
  };


  try{

    reconocimiento.start();

  }catch(error){

    reconocimientoActual = null;

    if(jarvisActivo){

      setTimeout(function(){

        escucharSeñor();

      },1000);
    }
  }
}


/* ==========================================
   ESCUCHAR ORDEN
   ========================================== */

function escucharOrden(){

  if(!jarvisActivo) return;


  const reconocimiento =
    new Reconocimiento();

  reconocimientoActual =
    reconocimiento;


  reconocimiento.lang = "es-GT";

  reconocimiento.interimResults = false;

  reconocimiento.continuous = false;


  reconocimiento.onstart =
  function(){

    vozEstado.textContent =
      "ESCUCHANDO ORDEN";

    respuesta.textContent =
      "Escuchando, señor...";
  };


  reconocimiento.onresult =
  function(event){

    const texto =
      event.results[0][0]
      .transcript
      .trim();


    reconocimientoActual = null;


    comando(texto);


    setTimeout(function(){

      if(jarvisActivo){

        escucharSeñor();

      }

    },3000);
  };


  reconocimiento.onerror =
  function(event){

    reconocimientoActual = null;

    if(!jarvisActivo) return;


    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      hablar(
        "El permiso del micrófono es necesario para continuar, señor."
      );

      jarvisActivo = false;

      return;
    }


    hablar(
      "No pude comprender la orden, señor. Intentémoslo nuevamente."
    );


    setTimeout(function(){

      if(jarvisActivo){

        escucharSeñor();

      }

    },1500);
  };


  reconocimiento.onend =
  function(){

    if(
      vozEstado.textContent ===
      "ESCUCHANDO ORDEN"
    ){

      vozEstado.textContent =
        "LISTA";
    }
  };


  try{

    reconocimiento.start();

  }catch(error){

    reconocimientoActual = null;

    if(jarvisActivo){

      setTimeout(function(){

        escucharSeñor();

      },1000);
    }
  }
}


/* ==========================================
   COMANDOS
   ========================================== */

function comando(texto){

  const pregunta =
    texto
      .toLowerCase()
      .trim();


  /* =========================
     SALUDOS
     ========================= */

  if(
    pregunta.includes("hola") ||
    pregunta.includes("buenos días") ||
    pregunta.includes("buenas tardes") ||
    pregunta.includes("buenas noches")
  ){

    hablar(
      "A sus órdenes, señor. Es un placer volver a trabajar con usted."
    );

    return;
  }


  /* =========================
     QUIÉN ES JARVIS
     ========================= */

  if(
    pregunta.includes("quién eres") ||
    pregunta.includes("quien eres")
  ){

    hablar(
      "Soy JARVIS Mark 6.1, su asistente personal. Mi función es ayudarle, ejecutar sus órdenes y mantener sus sistemas bajo control."
    );

    return;
  }


  /* =========================
     QUÉ PUEDE HACER
     ========================= */

  if(
    pregunta.includes("qué puedes hacer") ||
    pregunta.includes("que puedes hacer")
  ){

    hablar(
      "Puedo abrir sitios y aplicaciones compatibles, realizar búsquedas, consultar la hora y la fecha, comprobar el estado del sistema y ejecutar los comandos que usted vaya incorporando, señor."
    );

    return;
  }


  /* =========================
     ESTADO
     ========================= */

  if(
    pregunta.includes("estado del sistema") ||
    pregunta.includes("estado de jarvis") ||
    pregunta.includes("cómo está el sistema") ||
    pregunta.includes("como esta el sistema")
  ){

    hablar(
      "Todos los sistemas principales de JARVIS Mark 6.1 están operativos, señor."
    );

    return;
  }


  /* =========================
     HORA
     ========================= */

  if(
    pregunta.includes("hora")
  ){

    const hora =
      new Date().toLocaleTimeString(
        "es-GT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );


    hablar(
      "Son las " + hora + ", señor."
    );

    return;
  }


  /* =========================
     FECHA
     ========================= */

  if(
    pregunta.includes("día") ||
    pregunta.includes("fecha")
  ){

    const fecha =
      new Date().toLocaleDateString(
        "es-GT",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );


    hablar(
      "Hoy es " + fecha + ", señor."
    );

    return;
  }


  /* =========================
     YOUTUBE
     ========================= */

  if(
    pregunta.includes("youtube")
  ){

    hablar(
      "Por supuesto, señor. Iniciando YouTube."
    );


    setTimeout(function(){

      window.open(
        "https://www.youtube.com",
        "_blank"
      );

    },700);


    return;
  }


  /* =========================
     GOOGLE
     ========================= */

  if(
    pregunta.includes("abre google") ||
    pregunta.includes("abrir google")
  ){

    hablar(
      "Por supuesto, señor. Abriendo Google."
    );


    setTimeout(function(){

      window.open(
        "https://www.google.com",
        "_blank"
      );

    },700);


    return;
  }


  /* =========================
     BUSCAR
     ========================= */

  if(
    pregunta.includes("busca ") ||
    pregunta.includes("buscar ")
  ){

    let busqueda =
      pregunta
        .replace("busca ","")
        .replace("buscar ","")
        .trim();


    if(busqueda){

      hablar(
        "Realizando la búsqueda de " +
        busqueda +
        ", señor."
      );


      setTimeout(function(){

        window.open(
          "https://www.google.com/search?q=" +
          encodeURIComponent(busqueda),
          "_blank"
        );

      },700);

    }else{

      hablar(
        "¿Qué desea que busque, señor?"
      );
    }


    return;
  }


  /* =========================
     GOOGLE MAPS
     ========================= */

  if(
    pregunta.includes("abre maps") ||
    pregunta.includes("abre google maps") ||
    pregunta.includes("mapas")
  ){

    hablar(
      "Abriendo Google Maps, señor."
    );


    setTimeout(function(){

      window.open(
        "https://maps.google.com",
        "_blank"
      );

    },700);


    return;
  }


  /* =========================
     WHATSAPP
     ========================= */

  if(
    pregunta.includes("abre whatsapp") ||
    pregunta.includes("abrir whatsapp") ||
    pregunta === "whatsapp"
  ){

    hablar(
      "Abriendo WhatsApp, señor."
    );


    setTimeout(function(){

      window.location.href =
        "whatsapp://";

    },700);


    return;
  }


  /* =========================
     CHATGPT
     ========================= */

  if(
    pregunta.includes("abre chatgpt") ||
    pregunta.includes("abrir chatgpt")
  ){

    hablar(
      "Abriendo ChatGPT, señor."
    );


    setTimeout(function(){

      window.open(
        "https://chatgpt.com",
        "_blank"
      );

    },700);


    return;
  }


  /* =========================
     FACEBOOK
     ========================= */

  if(
    pregunta.includes("abre facebook") ||
    pregunta.includes("abrir facebook")
  ){

    hablar(
      "Abriendo Facebook, señor."
    );


    setTimeout(function(){

      window.open(
        "https://www.facebook.com",
        "_blank"
      );

    },700);


    return;
  }


  /* =========================
     DETENER
     ========================= */

  if(
    pregunta.includes("detente") ||
    pregunta.includes("detenerte") ||
    pregunta.includes("detener jarvis") ||
    pregunta.includes("cállate") ||
    pregunta.includes("callate")
  ){

    detener();

    return;
  }


  /* =========================
     DESCONOCIDO
     ========================= */

  hablar(
    "No tengo esa función instalada todavía, señor. Pero puedo incorporarla a mis sistemas."
  );
}


/* ==========================================
   ESTADO DE RED
   ========================================== */

function actualizarRed(){

  document.getElementById("red").textContent =
    navigator.onLine
      ? "CONECTADA"
      : "SIN CONEXIÓN";
}


actualizarRed();


window.addEventListener(
  "online",
  actualizarRed
);


window.addEventListener(
  "offline",
  actualizarRed
);


/* ==========================================
   BATERÍA
   ========================================== */

if(navigator.getBattery){

  navigator.getBattery()
  .then(function(bateria){

    function actualizarBateria(){

      document.getElementById(
        "bateria"
      ).textContent =
        Math.round(
          bateria.level * 100
        ) + "%";
    }


    actualizarBateria();


    bateria.addEventListener(
      "levelchange",
      actualizarBateria
    );

  })
  .catch(function(){

    document.getElementById(
      "bateria"
    ).textContent = "N/D";

  });
}else{

  document.getElementById(
    "bateria"
  ).textContent = "N/D";
}


/* ==========================================
   MENSAJE INICIAL
   ========================================== */

window.addEventListener(
  "load",
  function(){

    respuesta.textContent =
      "A su servicio, señor. Todos los sistemas están listos.";

  }
);

</script>

</body>
</html>
